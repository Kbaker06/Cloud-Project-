global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    environment: gameday

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pulse-api
    static_configs:
      - targets: ["api-1:8080", "api-2:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
