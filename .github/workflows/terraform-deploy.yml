# GitOps for infrastructure (project 01, dev environment):
#   PR    → plan with a READ-ONLY role, policy-check the plan with OPA, publish it to the job summary.
#   main  → same plan, then apply *that exact plan file* after a human approves the `dev` environment.
#
# One-time setup (see 04-devsecops-pipeline/README.md):
#   repo variables: AWS_REGION, TF_STATE_BUCKET, AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN
#   environment:    `dev` with required reviewers
# Until AWS_PLAN_ROLE_ARN is set this workflow skips itself, so forks stay green.
name: terraform-deploy

on:
  pull_request:
    paths: ["01-terraform-aws-foundation/**", "04-devsecops-pipeline/policy/**", ".github/workflows/terraform-deploy.yml"]
  push:
    branches: [main]
    paths: ["01-terraform-aws-foundation/**", "04-devsecops-pipeline/policy/**", ".github/workflows/terraform-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies against the same state at once.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_DIR: 01-terraform-aws-foundation/envs/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 0.70.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        # -lock=false: the plan role can only READ state. -detailed-exitcode: 0 = no changes, 2 = changes.
        run: |
          set +e
          terraform plan -lock=false -detailed-exitcode -out=tfplan -var "github_repository=${{ github.repository }}"
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -json tfplan > plan.json
          terraform show -no-color tfplan > plan.txt

      - name: policy check (OPA)
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "## Policy results" >> "$GITHUB_STEP_SUMMARY"
          opa eval --format pretty -d "$GITHUB_WORKSPACE/04-devsecops-pipeline/policy/terraform" -i plan.json 'data.main.warn' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # --fail-defined: exit non-zero if ANY deny rule produced a message.
          if ! opa eval --fail-defined --format pretty -d "$GITHUB_WORKSPACE/04-devsecops-pipeline/policy/terraform" \
               -i plan.json 'data.main.deny[msg]' > deny.txt; then
            echo "### ❌ Denied" >> "$GITHUB_STEP_SUMMARY"; cat deny.txt | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "### ✅ No policy violations" >> "$GITHUB_STEP_SUMMARY"

      - name: publish plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "## terraform plan — dev"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
            echo "<details><summary>Full plan</summary>"; echo; echo '```hcl'; head -c 60000 plan.txt; echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload plan for the apply job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1 # plans can contain sensitive values

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: dev # ← required reviewers gate this job
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}
      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      # Applying the saved plan guarantees we apply exactly what was reviewed. If state moved since
      # the plan, Terraform refuses ("Saved plan is stale") instead of doing something surprising.
      - name: apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply tfplan
