# Every push and PR: test, lint, policy-check and security-scan all six projects, then build,
# scan, SBOM and (on main) sign and publish the pulse-api image.
#
# Supply-chain notes:
#   * Every third-party action is pinned to a full commit SHA (tags can be moved; SHAs can't).
#   * Default token permissions are read-only; jobs opt in to exactly what they need.
#   * The image is signed keylessly with Sigstore — no signing key to leak.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: "1.13.4"
  HELM_VERSION: "v3.16.3"
  KUBECONFORM_VERSION: "v0.6.7"
  IMAGE: ghcr.io/${{ github.repository_owner }}/pulse-api

jobs:
  # ---------------------------------------------------------------------------
  go:
    name: go · pulse-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-k8s-platform/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 02-k8s-platform/app/go.mod
          cache-dependency-path: 02-k8s-platform/app/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: test (race detector + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # ---------------------------------------------------------------------------
  python:
    name: python · ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 03-serverless-event-pipeline
            install: pip install -r requirements-dev.txt
          - project: 05-cloud-security-auditor
            install: pip install -e '.[dev]'
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: ${{ matrix.install }}
      - run: pip install ruff==0.16.9
      - name: ruff (lint + format; config in pyproject.toml)
        run: ruff check . && ruff format --check .
      - run: python -m pytest -v

  # ---------------------------------------------------------------------------
  terraform:
    name: terraform · ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - 01-terraform-aws-foundation/modules/network
          - 01-terraform-aws-foundation/stack
          - 01-terraform-aws-foundation/envs/dev
          - 01-terraform-aws-foundation/envs/prod
          - 01-terraform-aws-foundation/bootstrap
          - 03-serverless-event-pipeline/terraform
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mocked AWS — no credentials)
        if: hashFiles(format('{0}/tests/*.tftest.hcl', matrix.dir)) != ''
        run: terraform test

  # ---------------------------------------------------------------------------
  kubernetes:
    name: helm + kubeconform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-k8s-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
      - run: helm lint charts/pulse-api
      - name: render + validate (default values)
        run: helm template t charts/pulse-api --set image.tag=ci | kubeconform -strict -summary -kubernetes-version 1.31.0 -
      - name: render + validate (prod values)
        run: |
          helm template t charts/pulse-api -f charts/pulse-api/values-prod.yaml --set image.tag=ci \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 -

  # ---------------------------------------------------------------------------
  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 0.70.0
      - run: opa fmt --fail -l 04-devsecops-pipeline/policy
      - run: opa test 04-devsecops-pipeline/policy -v

  # ---------------------------------------------------------------------------
  sre:
    name: prometheus rules + alert unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-sre-observability
    env:
      PROMETHEUS_VERSION: "3.15.1"
      ALERTMANAGER_VERSION: "0.34.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install promtool + amtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin --strip-components=1 "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
      - run: promtool check rules prometheus/rules/*.yml
      - run: promtool test rules prometheus/tests/*.yml
      - run: amtool check-config alertmanager/alertmanager.yml
      - name: dashboards are valid JSON
        run: for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done
      - run: docker compose config --quiet
      - run: bash -n chaos/chaos.sh

  # ---------------------------------------------------------------------------
  iac-scan:
    name: trivy · IaC misconfigurations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scan (SARIF for the Security tab; never fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: "0"
          format: sarif
          output: trivy-iac.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        # Fork PRs get a read-only token and can't upload; skip rather than fail.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
      - name: gate (fails on un-ignored HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          skip-setup-trivy: true

  # ---------------------------------------------------------------------------
  secrets:
    name: gitleaks · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --verbose

  # ---------------------------------------------------------------------------
  image:
    name: image · build, scan, SBOM, sign
    needs: [go, kubernetes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing via OIDC
      security-events: write
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=0.1.${{ github.run_number }},enable=${{ env.PUBLISH }}

      # 1) Build single-arch and load locally so we can scan BEFORE anything is published.
      - name: build (for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: 02-k8s-platform/app
          load: true
          tags: pulse-api:scan
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulse-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: pulse-api:scan
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: pulse-api-sbom.spdx.json

      # 2) Only on main: multi-arch build (cached), push, sign.
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push (amd64 + arm64)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: 02-k8s-platform/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=0.1.${{ github.run_number }}
          provenance: mode=max # SLSA provenance attestation
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign + attest SBOM (keyless)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
          echo "### Published \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Verify: `04-devsecops-pipeline/scripts/verify-image.sh '"${IMAGE}@${DIGEST}"'`' >> "$GITHUB_STEP_SUMMARY"
