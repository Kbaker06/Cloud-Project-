# Catch problems before they reach CI:  pip install pre-commit && pre-commit install
# Uses only local tools so it never downloads hooks from the internet at commit time.
repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive -check
        language: system
        files: \.(tf|tftest\.hcl)$
        pass_filenames: false
      - id: gofmt
        name: gofmt
        entry: bash -c 'test -z "$(gofmt -l 02-k8s-platform/app | tee /dev/stderr)"'
        language: system
        files: \.go$
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: bash -c 'for p in 03-serverless-event-pipeline 05-cloud-security-auditor; do (cd $p && ruff check . && ruff format --check .) || exit 1; done'
        language: system
        files: \.py$
        pass_filenames: false
      - id: opa-test
        name: opa test
        entry: opa test 04-devsecops-pipeline/policy
        language: system
        files: \.rego$
        pass_filenames: false
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --staged --no-banner --redact .
        language: system
        pass_filenames: false
