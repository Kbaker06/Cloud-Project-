[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudaudit"
version = "0.1.0"
description = "Scan an AWS account for security misconfigurations and wasted spend."
requires-python = ">=3.10"
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = ["moto[ec2,s3,iam,rds,cloudtrail,sts]>=5.0", "pytest>=8.0"]

[project.scripts]
cloudaudit = "cloudaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cloudaudit", "conftest", "handler"]
